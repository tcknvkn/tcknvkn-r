name: CI

on:
  push:
    branches:
      - release
      - development
    tags:
      - "v*"
  pull_request:
    branches:
      - release
      - development

permissions:
  contents: write
  deployments: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Show R version
        run: Rscript --version

      - name: Run unit tests
        run: Rscript tests/test_tcknvkn.R

      - name: Build package
        run: R CMD build .

  verify-tag-on-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is on release branch
        run: |
          git fetch origin release --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/release"

  deploy-beta:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: r-beta

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Run unit tests
        run: Rscript tests/test_tcknvkn.R

      - name: Build package
        run: R CMD build .

      - name: Archive package files
        run: tar -czf tcknvkn-r-${{ github.ref_name }}.tar.gz R tests examples DESCRIPTION NAMESPACE README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-r-${{ github.ref_name }}
          path: tcknvkn-r-${{ github.ref_name }}.tar.gz

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            R için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi beta sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/r
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #rstats #tcknvkn #tcuret #vknuret

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta')
    needs: verify-tag-on-release
    runs-on: ubuntu-latest
    environment:
      name: r-production

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Run unit tests
        run: Rscript tests/test_tcknvkn.R

      - name: Build package
        run: R CMD build .

      - name: Archive package files
        run: tar -czf tcknvkn-r-${{ github.ref_name }}.tar.gz R tests examples DESCRIPTION NAMESPACE README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v4
        with:
          name: tcknvkn-r-${{ github.ref_name }}
          path: tcknvkn-r-${{ github.ref_name }}.tar.gz

      - name: Cleanup beta tag, release and deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const betaTag = "v0.0.1-beta.1";

            try {
              const betaRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag: betaTag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: betaRelease.data.id });
              core.info(`Deleted beta release: ${betaTag}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`Beta release not found: ${betaTag}`);
            }

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${betaTag}` });
              core.info(`Deleted beta tag: ${betaTag}`);
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) {
                throw error;
              }
              core.info(`Beta tag not found: ${betaTag}`);
            }

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: "r-beta", per_page: 100 }
            );

            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                { owner, repo, deployment_id: deployment.id, per_page: 100 }
              );

              const isInactive = statuses.some((status) => status.state === "inactive");
              if (!isInactive) {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  auto_inactive: true
                });
              }

              await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: deployment.id });
              core.info(`Deleted beta deployment: ${deployment.id}`);
            }

      - name: Create production release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            R için TCKN (TC Kimlik No) ve VKN (Vergi Kimlik No) doğrulama kütüphanesi kararlı sürümü.

            İlgili bağlantılar:
            - https://www.tcknvkn.com/kutuphaneler
            - https://www.tcknvkn.com/kutuphaneler/nodejs
            - https://www.tcknvkn.com/tc-uret
            - https://www.tcknvkn.com/tc-no-uret
            - https://www.tcknvkn.com/tc-uretici
            - https://tcknvkn.com/tckn-uret
            - https://www.tcknvkn.com/vergi-no-uret
            - https://www.tcknvkn.com/vergi-no-uretici
            - https://tcknvkn.com/vkn-uret

            #tckn #vkn #rstats #tcknvkn #tcuret #vknuret